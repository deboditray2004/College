<input type="number" id="timeInput" placeholder="Seconds">
<button onclick="startTimer()">Start</button>
<h2 id="timerDisplay">00:00</h2>

<script>
  let timerInterval;

  function startTimer() {
    clearInterval(timerInterval); // Reset if already running
    let timeLeft = parseInt(document.getElementById('timeInput').value);
    if (isNaN(timeLeft) || timeLeft <= 0) return;

    const display = document.getElementById('timerDisplay');
    
    timerInterval = setInterval(() => {
      display.textContent = timeLeft + " seconds remaining";
      timeLeft--;

      if (timeLeft < 0) {
        clearInterval(timerInterval);
        display.textContent = "Time Over";
      }
    }, 1000);
  }
</script>
